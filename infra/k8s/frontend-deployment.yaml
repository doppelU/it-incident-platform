apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: it-incident-platform-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4000
          env:
            - name: NG_ALLOWED_HOSTS
              value: localhost
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30400